<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Todo Tết</title>
    <link rel="stylesheet" href="bai1.css">
</head>

<body>

    <div class="page-wrapper">

        <div class="container">

            <div class="header">
                <h1>Chuẩn bị Tết Nguyên Đán</h1>
                <p>Danh sách việc cần làm</p>
            </div>

            <ul id="todoList">
                <li class="todo-item">
                    <span>🌸 Mua bánh chưng</span>
                    <span class="status">Chưa làm</span>
                </li>

                <li class="todo-item">
                    <span>🌸 Dọn nhà đón Tết</span>
                    <span class="status">Chưa làm</span>
                </li>

                <li class="todo-item">
                    <span>🌸 Gói bánh chưng</span>
                    <span class="status">Chưa làm</span>
                </li>

                <li class="todo-item">
                    <span>🌸 Trang trí nhà cửa</span>
                    <span class="status">Chưa làm</span>
                </li>
            </ul>

            <div class="footer">
                Đã lưu vào localStorage lần đầu tiên • Refresh trang để kiểm tra
            </div>

        </div>

    </div>

    <script src="bai1.js"></script>
</body>

</html>
